lass="iso-wire-end" cx="185.8" cy="150.8" r="1"/></g></g></svg></div></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Candle tiles: height is the price</span><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Over-limit flag</span><span class="iso-key"><svg class="iso-swatch" data-mark="flat" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 6.5 8 3.5 14 6.5 8 9.5Z"/></svg>Back row: backtest deck, AI analyst teleprinter, broker order press</span></span><span class="iso-caption">Market data prints daily candles onto the belt. The AI gantry reads them (no call under 80 candles), the alert feeler rings the bell when a price passes its stop, and the price tap restacks the allocation coins (each coin 2.5% of the portfolio, rail at 30%). The card cabinet is the trade journal. The reel deck replays years of candles to draw a strategy's equity curve (backtesting), the teleprinter types plain-language answers to questions (AI analyst), and the order press stamps a ticket and sends it down the tube to your broker, with the fill coming back through the duct into the journal (broker trading).</span></figcaption></figure></main></body></html>
