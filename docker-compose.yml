services:
  # --- PostgreSQL Database ---
  postgres:
    image: postgres:16-alpine
    container_name: untoldmoney-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-untoldmoney}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-untoldmoney}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-untoldmoney}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Redis ---
  redis:
    image: redis:7-alpine
    container_name: untoldmoney-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- FastAPI Backend ---
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: untoldmoney-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override host-based defaults with Docker service names
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # Assemble full URLs pointing to Docker service names
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-untoldmoney}:${POSTGRES_PASSWORD:-changeme_postgres_password}@postgres:5432/${POSTGRES_DB:-untoldmoney}"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/1"
      CELERY_RESULT_BACKEND: "redis://redis:6379/2"
    volumes:
      - ./apps/api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "
        echo 'Running migrations...' &&
        alembic upgrade head 2>/dev/null || echo 'No migrations to run (generate with: alembic revision --autogenerate)' &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

  # --- Next.js Frontend ---
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: untoldmoney-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api

  # --- Celery Worker ---
  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: untoldmoney-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-untoldmoney}:${POSTGRES_PASSWORD:-changeme_postgres_password}@postgres:5432/${POSTGRES_DB:-untoldmoney}"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/1"
      CELERY_RESULT_BACKEND: "redis://redis:6379/2"
    volumes:
      - ./apps/api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app:celery_app worker --loglevel=info --concurrency=2

  # --- Celery Beat Scheduler ---
  scheduler:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: untoldmoney-scheduler
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-untoldmoney}:${POSTGRES_PASSWORD:-changeme_postgres_password}@postgres:5432/${POSTGRES_DB:-untoldmoney}"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/1"
      CELERY_RESULT_BACKEND: "redis://redis:6379/2"
    volumes:
      - ./apps/api:/app
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app:celery_app beat --loglevel=info

volumes:
  postgres_data:
  redis_data:
